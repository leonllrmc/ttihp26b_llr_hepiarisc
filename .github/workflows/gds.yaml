name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Pin-only global regression on the manufactured netlist
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b
        with:
          test-dir: test/gatelevel
      - name: Fall back to VCD if only FST was produced
        if: always()
        run: |
          cd test/gatelevel
          if [ ! -s tb.vcd ] && [ -f tb.fst ] && command -v fst2vcd >/dev/null; then
            fst2vcd tb.fst -o tb.vcd
          fi

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b
